[project]
name = "zeitspur"
dynamic = ["version"]
description = "Zeitspur: verschluesselter Aktivitaetsverlauf (Screenshots + OCR) fuer Windows"
requires-python = ">=3.11"

[tool.setuptools.dynamic]
version = { attr = "zeitspur.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
